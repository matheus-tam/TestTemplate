name: Repository Setup

on:
  workflow_dispatch:

jobs:
  create_dev_branch_and_variable:
    runs-on: ubuntu-latest
    #if: github.run_number == 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Create dev branch from main
        run: |
          git fetch origin
          if git ls-remote --exit-code --heads origin dev; then
            echo "Dev branch already exists. Skipping creation."
          else
            git checkout prd
            git pull
            git checkout -b dev
            git push -u origin dev
            echo "Dev branch created and pushed."
          fi

      - name: Set repository variable
        env:
          GH_TOKEN: ${{ secrets.TOKEN_GITHUB }}
        run: |
          gh variable set FOLDER_NAME --body "Shared"
