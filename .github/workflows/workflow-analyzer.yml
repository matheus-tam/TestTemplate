name: Analyze Package and Comment on PR with results

on:
  pull_request:
    types: [opened]

jobs:
  analyze-and-comment:
    runs-on: [self-hosted]
    steps:
    - uses: actions/checkout@v2

    - name: Analyze Package
      run: |
        uipcli package analyze "C:\Users\matheus.pessanha\Documents\UiPath\CICD_Demo\project.json" --analyzerTraceLevel "Error" --stopOnRuleViolation --governanceFilePath "C:\Users\matheus.pessanha\Documents\UiPath\CICD_Demo\testWorkflowAnalyzer\uipath.policy.Development.json" --resultPath "results.json"
        
    - name: Read results.json
      id: results
      run: echo "::set-output name=content::\$(cat results.json)"
      shell: bash

    - name: Comment PR
      uses: actions/github-script@v6
      with:
        github-token: ${{secrets.GITHUB_TOKEN}}
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: 'Analysis Results:\n```json\n' + \${{ steps.results.outputs.content }} + '\n```'
          })
