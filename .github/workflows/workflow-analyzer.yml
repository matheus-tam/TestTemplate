name: Analyze Package and Comment on PR with result

on:
  pull_request:
    types: [opened]

jobs:
  analyze-and-comment:
    runs-on: [self-hosted]
    steps:
    - uses: actions/checkout@v2

    - name: Analyze Package
      run: |
        uipcli package analyze "C:\Users\matheus.pessanha\Documents\UiPath\CICD_Demo\project.json" --analyzerTraceLevel "Error" --governanceFilePath "C:\Users\matheus.pessanha\Documents\UiPath\CICD_Demo\testWorkflowAnalyzer\uipath.policy.Development.json" --resultPath "C:\Users\matheus.pessanha\Documents\UiPath\CICD_Demo\testWorkflowAnalyzer\results.json"
        
    # - name: Read results.json
    #   id: results
    #   run: |
    #       $content = Get-Content "C:\Users\matheus.pessanha\Documents\UiPath\CICD_Demo\testWorkflowAnalyzer\results.json" -Raw
    #       echo "::set-output name=results::$content"
    #   shell: pwsh

    - name: Comment on PR using GitHub CLI
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: pwsh
      run: |
            # Read and parse the JSON
            $json = Get-Content "C:\Users\matheus.pessanha\Documents\UiPath\CICD_Demo\testWorkflowAnalyzer\results.json" -Raw | ConvertFrom-Json
        
            # Start building the Markdown table
            $lines = @()
            $lines += "🔎 **UiPath Analyzer Rule Summary**"
            $lines += ""
            $lines += "| Description | Recommendation |"
            $lines += "|-------------|----------------|"
        
            foreach ($item in $json) {
              $desc = ($item.Description -replace '\|','\|') -replace '\r?\n', ' '
              $rec  = ($item.Recommendation -replace '\|','\|') -replace '\r?\n', ' '
        
              # Escape markdown special characters inside cells
              $desc = $desc.Replace('`', '``').Trim()
              $rec = $rec.Replace('`', '``').Trim()
        
              $lines += "| $desc | $rec |"
            }
        
            $lines += ""
            $lines += "_For full details, see the uploaded artifact attachment._"
        
            # Join all lines and post comment
            $body = $lines -join "`n"
        
            gh pr comment ${{ github.event.pull_request.number }} --body "$body"
         
      
